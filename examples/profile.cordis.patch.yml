# Example profile configuration ($DSH_HOME/profiles/<profile>/cordis.patch.yml).
# Replace <placeholders> before first start; see docs/006-deployment.md.
- id: webserver
  config:
    host: 127.0.0.1
    port: 3082
- id: dsh-superagent
  config:
    stateDir: <absolute path, for example /home/me/.dsh/state/superagent>
# Feishu is optional: uncomment to enable its Source, then set the bot's lark-cli on the Feishu Source.
# - id: dsh-superagent-feishu
#   disabled: false
# Environment/host UI uses the main plugin's stateDir automatically; leave inventoryFile empty for password hosts.
# Optional legacy read-only OpenSSH inventory mode (does not merge with UI-managed hosts):
# Copy examples/remote-ops.inventory.example.json outside the repository and replace the example values.
# - id: dsh-superagent-remote-ops
#   config:
#     inventoryFile: /home/me/.config/dsh/remote-ops.json
#     timeoutSeconds: 30
#     maxOutputBytes: 65536
#     maxConcurrent: 2
